name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: RIQMA Pro ${{ steps.get_version.outputs.tag }}
          body: |
            ### RIQMA Pro ${{ steps.get_version.outputs.tag }} Update
            - Zero-Data-Loss Offline & Hybrid Audit Protection:
              * Fail-safe JSON serialization with universal fallback encoder (prevents DocumentReference crashes)
              * Atomic file writing with automatic .bak backup and corruption recovery
              * App-kill protection: immediate disk flush on lifecycle pause/inactive/detached
              * Seamless hybrid online/offline unification (auto-merges planned and unplanned drafts for the same turbine)
              * Guarded reference resolution (zero dummy overwrites on reconnect)
            - Resumable Range-Engine In-App Updater with Auto-Retry
            - Interactive Bottom Navigation Bar
            - Dual Authentication: Firebase Auth with Renom Server fallback
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

