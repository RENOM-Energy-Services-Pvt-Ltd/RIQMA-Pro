name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: RIQMA Pro ${{ steps.get_version.outputs.tag }}
          body: |
            ### RIQMA Pro ${{ steps.get_version.outputs.tag }} Update
            - Bulletproof Photo Upload Engine with Zero-Photo-Loss Guarantee:
              * Resilient local photo retention during partial or failed uploads
              * Dedicated bandwidth sequential uploads with adaptive exponential backoff
              * Automatic multi-pass auto-retries (up to 3 passes) for weak site connections
              * Direct camera capture & gallery album import fallback protection
              * Strict verification gate: 100% photo validation before audit submission
              * Interactive recovery modal with 1-click retry for pending photos
            - Direct In-App 1-Click Update System
            - Next-Gen Interactive Bottom Navigation Bar
            - Dual Authentication: Firebase Auth with Renom Server fallback
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

